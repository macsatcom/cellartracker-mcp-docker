services:
  cellartracker-mcp:
    # Pulls the pre-built, multi-arch (amd64+arm64) image that
    # .github/workflows/release.yml publishes automatically whenever a new
    # cellartracker-mcp version ships. To build locally from source instead,
    # replace this `image:` line with:
    #   build:
    #     context: .
    #     args:
    #       CT_MCP_VERSION: "X.Y.Z"   # see Dockerfile's current pinned version
    image: ghcr.io/macsatcom/cellartracker-mcp-docker:latest
    env_file:
      - .env
    ports:
      # Bound to all interfaces so other devices on your LAN (e.g. a separate
      # machine/container running Open WebUI) can reach this. Security note:
      # this exposes the API to anyone on your local network — keep
      # MCPO_API_KEY set in .env unless you fully trust everyone on it. If
      # you only ever access this from the same host, you can tighten this
      # back to "127.0.0.1:${PORT:-8000}:8000" instead.
      - "${PORT:-8000}:8000"
    volumes:
      - cellartracker-cache:/data/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/openapi.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cellartracker-cache:
